[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobscraper"
version = "1.0.0"
description = "Scrape job postings and extract structured requirements, match scores and skill gaps"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sanjeev Kumar" }]
keywords = ["jobs", "scraping", "ats", "requirements", "recruitment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Office/Business",
]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
jobscraper = "jobscraper.cli:main"

[project.urls]
Homepage = "https://github.com/ksanjeev284/job-scraper"
Issues = "https://github.com/ksanjeev284/job-scraper/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
