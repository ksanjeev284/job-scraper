architecture, technical design and solution, data model, data catalog, test strategy, test plan and test results. Liaise between business and technical aspects of projects. Responsible for stakeholder management and engagement with senior leadership across different departments within the company during the entire product development and launch process. Collaborate with the Business Team to elicit business needs and requirements, determine the scope and prioritize the data use-cases. Plan project stages. Create and maintain data product goal, vision, use-cases, and Product Backlog Items for building data products. Define and document product requirements including features, user stories, and acceptance test criteria. Collaborate with project personnel including Data Architects, Data Analysts, and Data Engineers for problem solving and solution design. Work with the Data Analyst and Data Engineer to troubleshoot any issues/data discrepancies. Guide the BI Engineer in creating the business intelligence dashboard/visualizations and provide feedback and sign-off. Collaborate with the Delivery Lead on project delivery timelines, estimated effort and delivery roadmap. Collaborate with the Data team leadership, IT team and DevOps team on product deployment planning and implementation. Participate and contribute to Scrum events as a part of Agile product development. Participate and contribute to data governance and data quality initiatives. Provide mentorship to team members on different topics related to data product build, data cataloging, data quality and governance of data products. Communicate with stakeholders on product updates, implementation details and train users on product features.</span></p><p style='text-align:justify;margin:0.0in 0.0in 8.0pt;line-height:115%;font-size:12.0pt;font-family:Aptos, sans-serif'><span style='font-size:11.0pt;line-height:115%;font-family:&#39;Times New Roman&#39;, serif'>Requirements: Bachelor’s degree in Information Technology, Computer Science, Computer/Electronics Engineering, Business Data Analytics, or a closely related field plus 5 years of experience as a Business/Data Analyst, Software Engineering Analyst, Software Engineer, Data/Analytics Engineer, or closely related position. Prior work experience must include: Applied knowledge of insurance domain and products specific to Property and Casualty Insurance, Reinsurance, and Specialty Insurance; Applied knowledge of Insurance Finance and experience in financial and regulatory reporting, as well as advanced analytics implementation in the insurance domain; Applied knowledge of data management practices, processes, and tools; Demonstrated experience in Data Architecture, Data Modeling, Data Engineering, Data Governance, Data Quality, Data Security and Privacy, Data Reporting and Data Visualization, and Cloud Technologies; Product development and management, product ownership, and project management; Applied knowledge of business processes, workflows, systems, and applications across various insurance business functions mainly focusing on Underwriting, Claims, Operations, Distribution and Finance; Knowledge of source system applications like Guidewire, Duck Creek, and Dynamics 365; Applied knowledge of insurance business metrics and Key Performance Indicators, both operational and financial; Experience with reports and dashboards used for understanding business performance within the company/divisions/product lines/business functions, as applicable; Leading cross-functional teams to deliver products and projects with applied knowledge of Agile framework, practices, and product development principles; Applied knowledge of third-party datasets and data integration for data enrichment and risk profiling and management in Insurance domain; Working on cloud platforms (e.g., AWS, Azure, GCP) and related services for data storage, processing, and analytics; Using visualization tools such as Power BI and programming languages such as SQL/R/Python; and, using Agile Project Management Tools like Azure Dev Ops/Rally/Jira. May telecommute but must have ability to report to Hartford, CT office 2 times per week.</span></p><p style='text-align:justify;margin:0.0in 0.0in 8.0pt;line-height:115%;font-size:12.0pt;font-family:Aptos, sans-serif'><span style='font-size:11.0pt;line-height:115%;font-family:&#39;Times New Roman&#39;, serif'>Benefits: Opportunity for company bonus based upon a percentage of eligible pay.  In addition, the company makes available a variety of benefits to employees, including health insurance coverage, an employee wellness program, life and disability insurance, 401k match, retirement savings plan, paid holidays and paid time off (PTO). </span></p><p style='margin:0.0in 0.0in 8.0pt;line-height:115%;font-size:12.0pt;font-family:Aptos, sans-serif'> </p>","employmentType":"Full-Time","identifier":{"@type":"PropertyValue","name":"Job ID","value":"14072"},"title":"Data Product Owner","url":"https://careers.munichre.com/en/job/hartford/data-product-owner/3342/45469410752","directApply":false,"hiringOrganization":{"@type":"Organization","name":"ERGO | Munich Re | MEAG"},"jobLocation":[{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"Hartford","addressRegion":"US-CT","addressCountry":"USA","streetAddress":"One State St, PO Box 5024","postalCode":"06102-5024"}}]}</script></head><body></body></html>
